name: Run Python Script and Upload Result

on:
  schedule:
    - cron: '0 2 * * *' # 每天 2:00 UTC 运行一次
  workflow_dispatch: # 允许手动运行

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run script and save output
        run: |
          python main.py > output.json

      - name: Upload to Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          curl -X PATCH "https://api.github.com/gists/$GIST_ID" \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --argfile f output.json --arg name result.json '{files: {($name): {content: $f}}}')"
